        .banner {
            width: 1226px;
            height: 614px;
            background-color: pink;
            margin: 100px auto;
        }

        .banner .left {
            width: 234px;
            height: 614px;
            background-color: #ccc;
            float: left;
        }

        .banner .right {
            width: 992px;
            height: 614px;
            background-color: yellow;
            float: left;
        }

        .banner .left a,
        .banner .left img {
            /* 转换成块级元素 */
            display: block;
        }

        .banner .right ul li {
            width: 234px;
            height: 300px;
            background-color: green;
            float: left;
            margin: 0 0 14px 14px;
        }

        .banner .right ul li a {
            display: block;
            height: 300px;
            /* 文本在水平对齐方式：让块级元素里面在内容居中；有继承性 */
            text-align: center;
        }

        .banner .right ul li a .desc {
            font-size: 12px;
            color: #ccc;
            margin: 10px 0 15px 0;
        }

        .banner .right ul li a img {
            display: block;
            margin: 0 auto;
        }

            height: 40px;

            height: 40px;

            color: #9C9C9C;
            float: left;
            height: 40px;
            line-height: 40px;
        }

        .top .top_nav span,
        .top .login span {
            font-size: 10px;
            color: #3C3C3C;
            margin: 0 3px;
        }

        .top .top_nav a:hover {
            color: white;
        }

        .top .login .shopCar {
            width: 120px;
            height: 40px;
            float: right;
        }

        .top .login .shopCar a {
            float: none;
            display: block;
            text-align: center;
            background-color: rgba(0,0,0,.3);
        }

        .top .login .shopCar a span {
            float: none;
            color: #ccc;
        }

        .top .login .shopCar a:hover {
            background-color: #fff;
        }

        .top .login .shopCar a:hover i,
        .top .login .shopCar a:hover span {
            color: orange;
            font-weight: 900;
        }

        .foot {
            width: 1226px;
            height: 400px;
            background-color: pink;
            margin: 0 auto;
        }

        .foot dl {
            width: 200px;
            height: 400px;
