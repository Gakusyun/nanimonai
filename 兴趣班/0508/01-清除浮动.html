<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .clearfix::after {
            content: '';
            display: block;
            height: 0;
            clear: both;
        }

        .nav {
            width: 200px;
            height: 200px;
            background-color: yellow;
            float: left;
        }

        .box {
            background-color: pink;
            /* 给浮动元素在父元素添加 overflow: hidden 属性 */
            /* 触发BFC机制 block forttming context */
            /* overflow: hidden; */
        }

        .box p {
            float: left;
        }

        .banner {
            width: 1200px;
            height: 300px;
            background-color: blue;
            margin: 20px auto;
        }

        ul li {
            list-style: none;
        }

        .main {
            width: 1226px;
            height: 614px;
            background-color: pink;
            margin: 50px auto;
        }

        .left1 {
            width: 234px;
            height: 614px;
            background-color: red;
            float: left;
        }

        .right {
            width: 992px;
            height: 614px;
            background-color: blue;
            float: left;
        }

        .right ul li {
            width: 234px;
            height: 300px;
            background-color: pink;
            float: left;
            margin: 0 0 14px 14px;
        }

        a:hover {
            color: greenyellow;
        }

        span::after {
            content: '唱跳rap篮球';
        }

        /* .right ul::after {
            content: '';
            display: block;
            height: 0;
            clear: both;
        } */

        /* .last::after {
            content: '666';
        } */
    </style>
</head>
<body>
    <!-- 清除浮动带来在影响 -->
    <div class="box clearfix">
        <div class="nav"></div>
        <p>1</p>
        <p>2</p>
        <p>3</p>
        <p>4</p>
        <p>5</p>
        <p>6</p>
        <p>7</p>
        <p>8</p>
        <p>9</p>
        <p>10</p>
        <p>11</p>
        <p>12</p>
        <p>13</p>
        <p>14</p>
        <p>15</p>
        <p>16</p>
        <p>17</p>
        <p>18</p>
        <p>19</p>
        <p>20</p>
    </div>
    <div class="banner"></div>
    <div class="main">
        <div class="left1"></div>
        <div class="right">
            <ul class="clearfix">
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li class="last"></li>
                <!-- 额外标签法 -->
                <!-- <div style="clear: both;"></div> -->
            </ul>
        </div>
    </div>
    <span>蔡徐坤</span>
</body>
</html>
